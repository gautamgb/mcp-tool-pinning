[project]
name = "mcp-tool-pinning"
version = "0.1.0"
description = "Prototype for the MCP SEP draft on client-held tool definition pinning"
readme = "README.md"
authors = [
    { name = "Gautam Bharti", email = "3028386+gautamgb@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp==2.2.0",
    "rfc8785==0.1.4",
]

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 110

[tool.mypy]
strict = true

[tool.pytest.ini_options]
pythonpath = ["tests"]
